# --- Examples below are disabled (commented out). Uncomment and adjust to
# --- your own community's jargon/territory before relying on them.

# Example: notifies when hostiles are reported. Data-derived from this
# corpus: real usage skews heavily towards "red(s)" and
# "tackle(d)/bubble(d)/camp(ed)" (811 hits) rather than the word "hostile"
# itself (only 71 hits) -- a naive keyword list built from the word
# "hostile" alone would have missed the majority of real reports.
# Restricted to "wc.Vale+Tribute" because, unrestricted, "red"/"camp" also
# match unrelated chatter and pilot names elsewhere (e.g. a pilot literally
# named "Eyez Red" accounts for 36 of the 204 "red" hits -- harmless here
# since it is still a valid spotted-pilot report, but worth knowing about if
# you tune this further).
# [[patterns]]
# id = "hostile_report"
# pattern = '\b(hostile|hostiles|red|reds|neut|neuts|tackle|tackled|tackling|bubble|bubbled|camp|camped|camping)\b'
# case_insensitive = true
# channels = ["wc.Vale+Tribute"]
# action = { type = "notify" }

# Example: notifies when capital/supercapital hulls or a cyno are
# mentioned. Data-derived: 3977 raw hits, but only 147 of them in
# "wc.Vale+Tribute" -- unrestricted, this rule is dominated by "Phoenix Navy
# Issue"/"Dread Guristas ..." HyperNet-lottery and faction-module trade spam
# in Local, hence the channel restriction. Known remaining false-positive
# source even inside "wc.Vale+Tribute": EVE faction modules named "Dread
# Guristas <Module>" (e.g. "Dread Guristas Cruise Missile Launcher") match
# the "dread" keyword; ~44% of raw "dread" hits were this item name rather
# than a ship sighting. Requiring the full word "dreadnought" instead would
# remove that false positive but would also miss 80/89 (90%) of the genuine
# reports, which almost always use the "dread" shorthand -- kept as-is since
# a stray notification is low-cost (this is `notify`, not `map_alert`).
# [[patterns]]
# id = "capital_report"
# pattern = '\b(titan|titans|super|supers|dread|dreads|dreadnought|dreadnoughts|carrier|carriers|fax|faxes|cyno|cynos)\b'
# case_insensitive = true
# channels = ["wc.Vale+Tribute"]
# action = { type = "notify" }

# Example: informal/abbreviated system nicknames -- this alliance's own
# pilots write "4-h" for "4-HWWF" (120 raw hits), "h-5" for "H-5GUI" (16
# hits), "1-g"/"1-gb" for "1-GBBP", or "g5ed-y" as an exact lowercase form
# of "G5ED-Y". system_reported does not catch any of these: it requires the
# full code, including the trailing dash-suffix, in its original case.
#
# This is a `[[dictionaries]]` entry, not a generic regex over "any short
# alnum-dash token" -- investigated that shape across the whole corpus and
# it also matches a market-tool URL domain (janice.e-351.com, 47 hits) and
# hex GUID fragments (115 lines), which would spam the map with garbage
# alerts, plus leetspeak pilot handles ("Ki11-Shot"). Listing every real
# alias by hand avoids all of that, at the cost of having to maintain the
# list yourself.
#
# Deliberately a single dictionary, not one per language like
# ship_report_es/fr/ja/ko above: unlike ship names, these aliases are not a
# translation of anything in the SDE (solar system names are not localized
# at all -- see the note on ship_report_zh) -- they are informal shorthand
# coined by a specific community/alliance, so "per language" is not a
# meaningful axis to split them on. If different communities you monitor
# use conflicting shorthand for different systems, keep them in separate
# dictionaries (with different `channels`) instead of merging into this
# one.
#
# `{ type = "map_alert" }` on a dictionary needs no `system_group`: the
# matched word itself (e.g. "4-h") is looked up directly, resolved via SQL
# LIKE '%<word>%' against solar system names (see the field docs at the top
# of this file), so a short fragment like "4-h" will usually resolve to the
# right system, but is not guaranteed to if another system elsewhere shares
# the same fragment and there is no exact match. Replace the aliases below
# with your own alliance's actual home/staging systems (grep your own logs
# the same way documented in this file's other rules to find them) before
# enabling.
# [[dictionaries]]
# id = "system_alias_example"
# words = ["4-h", "h-5", "1-g", "1-gb", "g5ed-y"]
# case_insensitive = true
# action = { type = "map_alert" }
