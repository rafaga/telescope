# Telescope pattern rules.
#
# Every rule in [[patterns]] is evaluated against the text payload of each
# parsed EVE Online chat log line read from the monitored intel files.
# Every entry in [[dictionaries]] is evaluated the same way, for rules whose
# alternatives are a flat list of words rather than a hand-written regex
# (see the "Dictionary rules" section below).
#
# If this file is missing or corrupted, Telescope regenerates it with the
# default content below; a corrupted file is backed up as patterns.toml.bak.
# Invalid individual rules are skipped and reported in the notification log.
#
# [[patterns]] fields:
#   id               (required) unique id, allowed chars: [A-Za-z0-9_-], max 64.
#   pattern          (required) Rust regex (https://docs.rs/regex), max 1024 chars.
#                    TOML literal strings ('...') are recommended so regex
#                    backslashes do not need escaping.
#   case_insensitive (optional) boolean, default false.
#   channels         (optional) list of channel names; empty = every channel.
#   enabled          (optional) boolean, default true.
#   action           (optional) table, default { type = "notify" }.
#                    - { type = "notify" }
#                        sends the matched line to the app notification log.
#                    - { type = "map_alert", system_group = "<group>" }
#                        resolves the named capture group as a solar system
#                        and highlights it on the maps. The group must exist
#                        in the pattern. Every match in the line is a
#                        candidate (up to 8), since a pilot name written
#                        before the system also fits the pattern; candidates
#                        that are not a real system are dropped. A candidate
#                        resolves by its exact name (any case). Only
#                        code-like text (with a digit or a dash, e.g. "H-5GU"
#                        or "4-h") may also resolve to the first system whose
#                        name contains it (SQL LIKE '%<text>%', see
#                        resolve_reported_system / SdeManager::get_system_id),
#                        which is not guaranteed to be the system you meant
#                        if the text is a short/ambiguous fragment.
#                    - { type = "ignore" }
#                        drops the whole line: no other rule (pattern or
#                        dictionary) is evaluated on it, whatever order the
#                        rules are declared in. For lines that are never
#                        intel. Only for [[patterns]].
#   category         (optional) what a match adds to the map tooltip summary
#                    shown for a line that raised a map alert:
#                    - "ship"    the matched text is a ship name; ships are
#                                listed grouped, e.g. "Drake ×2".
#                    - "count"   the pattern's `count` capture group
#                                (required) is the number of pilots
#                                reported, e.g. "+3".
#                    - "clear"   the line reports the system clear: it is
#                                listed with a check mark and raises no
#                                visual alert or sound.
#                    - "keyword" shorthand with nothing to show (e.g. "nv"):
#                                only removed from the leftover text.
#                    - "query"   the line asks about the system (e.g.
#                                "status?") instead of reporting it: no map
#                                alert at all (no visual alert, no sound, no
#                                tooltip entry).
#                    A line with no ship and no count shows its leftover
#                    text instead (the line minus the reported system and
#                    every categorized match -- usually the pilot names),
#                    cut to 40 characters.
#
# Dictionary rules
# -----------------
# Some rules are naturally a flat list of words rather than a hand-written
# regex -- ship names in a given language, or a community's system
# nicknames. Splitting a large word list into several [[patterns]] entries
# just to fit under the 1024-char pattern budget hurts readability and
# forces an arbitrary split point. [[dictionaries]] entries exist for this
# shape of rule instead: each is matched by its own Aho-Corasick automaton,
# with no per-entry length budget. The trade-off is that a dictionary only
# matches literal words, whole-word (like a regex \b...\b), never a
# hand-written pattern.
#
# [[dictionaries]] fields:
#   id               (required) unique id. Shares its namespace with
#                    [[patterns]] ids: a dictionary cannot reuse a pattern
#                    rule's id or another dictionary's id.
#   words            (required) list of strings; the words to match,
#                    verbatim, whole-word. Max 4096 words, 128 bytes each.
#   case_insensitive (optional) boolean, default false. ASCII-only folding
#                    (a-z/A-Z); unlike [[patterns]]'s case_insensitive
#                    (full Unicode case folding via the `regex` crate),
#                    accented or non-Latin letters are matched by exact
#                    case only.
#   channels         (optional) same semantics as [[patterns]]'s channels.
#   enabled          (optional) boolean, default true.
#   action           (optional) table, default { type = "notify" }.
#                    - { type = "notify" }
#                        sends the matched line to the app notification log.
#                    - { type = "map_alert" }
#                        resolves the matched word itself as a solar system
#                        name and highlights it on the maps (no
#                        system_group needed: a dictionary has no regex
#                        capture groups, the matched word is itself the
#                        reported system name). Same LIKE-based resolution
#                        as [[patterns]]'s map_alert, documented above.
#   category         (optional) same as [[patterns]]'s category, except
#                    "count" (a dictionary has no capture groups).
#
# Rules below marked "data-derived" were built from a corpus of 9011 real
# chat log exports (196k lines, ~180k of them real chat after dropping the
# automatic "EVE System >" lines). About 38% of that traffic turned out to
# be repeated spam (HyperNet Relay lottery ads, PLEX/ISK scam broadcasts,
# recruitment spam) -- the same (author, text) pair repeated 5+ times -- so
# every frequency/precision figure quoted below was measured on the
# remaining ~110k organic, de-duplicated lines. The dedicated intel channel
# in that corpus is named "wc.Vale+Tribute" (a WinterCo alliance channel for
# the Vale of the Silent / Tribute regions); it concentrates the vast
# majority of the real signal for every rule below, while channels like
# Local also carry the HyperNet/scam spam.
#
# Note: Telescope currently derives that channel name by splitting the log
# file name on the *first* underscore (see `load_intel_file` in app.rs), so
# a channel whose own name contains an underscore (e.g. a channel literally
# named "WinterCo_Friends") is truncated to the part before it. This did not
# affect any channel name used below, but it is worth knowing if you add a
# rule scoped to a channel whose name has an underscore in it.

# Baseline rule: notifies every parsed intel line.
[[patterns]]
id = "intel_line"
pattern = ".+"
action = { type = "notify" }

# Highlights on the maps any solar system reported in the monitored channels.
# The pattern was derived from the 8436 real solarSystemName values in
# assets/sde.db (mapSolarSystems) and covers 100% of them:
#   - J\d{6}                          wormhole systems (2602)
#   - [A-Z0-9]{1,5}-[A-Z0-9]{1,4}     nullsec-style systems: 1DQ1-A, B-R5RB,
#                                     0IRK-R, Y-1918, J1226-0 (3712)
#   - [A-Z]{2}\d{3}                   coded systems: AD001 (200)
#   - [A-Z][a-z]{1,13}( ... ){0,2}    named systems, 1-3 capitalized words:
#                                     Jita, Old Man Star, Tash-Murkon Prime (1922)
# Keep case_insensitive = false: lowercase common words typed in chat
# ("jita", "van") would otherwise produce false map alerts.
[[patterns]]
id = "system_reported"
pattern = '\b(?P<system>J\d{6}|[A-Z0-9]{1,5}-[A-Z0-9]{1,4}|[A-Z]{2}\d{3}|[A-Z][a-z]{1,13}(?:[ -][A-Z][a-z]{1,13}){0,2})\b'
action = { type = "map_alert", system_group = "system" }

# Notifies when a "clear" report is posted.
[[patterns]]
id = "clear_report"
pattern = '\b(clear|clr)\b'
case_insensitive = true
action = { type = "notify" }
category = "clear"

# Data-derived, highest-value rule in this file: "nv" is this alliance's
# standard shorthand for "a pilot of unknown/neutral standing was seen" --
# the canonical report format observed thousands of times in the corpus is
# `<system>[*]  <pilot name(s)>  nv`, e.g. "H-5GUI*  Floris Saucus  nv". It
# appeared 7358 times in the raw corpus (7343 of those on organic,
# de-duplicated lines -- essentially none of it is spam), 99.7% of it in
# "wc.Vale+Tribute", making it ~19x more common than "hostile"/"red"/"neut"
# combined (811 raw hits). Sampled 175 non-trailing occurrences by hand:
# still genuine pilot-spotted reports with extra detail appended (e.g. "...
# nv likely manticore"), not a different meaning. If your community uses a
# different shorthand (some use "n", "rp", "nrv", ...) grep your own logs
# for the token that immediately follows a system+pilot-name report instead
# of assuming this one transfers as-is.
[[patterns]]
id = "neutral_spotted"
pattern = '\bnv\b'
case_insensitive = true
action = { type = "notify" }
category = "keyword"

# How many pilots a report is about, for the map tooltip: a leading "+3" or
# "x3" ("+3 Drake"), or a number followed by "x" or a pilot word ("3x",
# "3 neuts", "5 reds", "2 hostiles"). Two rules because a regex cannot give
# two alternatives the same group name. Numbers are capped at 3 digits and
# need one of those markers, so the digits inside system names (1DQ1-A,
# J123456) and pilot names never count.
[[patterns]]
id = "pilot_count_prefix"
pattern = '(?:^|\s)[+xX](?P<count>\d{1,3})\b'
action = { type = "notify" }
category = "count"

[[patterns]]
id = "pilot_count_suffix"
pattern = '\b(?P<count>\d{1,3})\s?(?:x|neuts?|neutrals?|reds?|hostiles?|pilots?)\b'
case_insensitive = true
action = { type = "notify" }
category = "count"

# Data-derived: reports of an ESS (Encounter Surveillance System) bank
# becoming raidable, usually with a countdown, e.g. "L-1HKR* ESS 5:00" or
# "NJ4X-S ess time?". 1355 raw hits (1346 with a strict \b...\b boundary,
# i.e. excluding "process"/"success"/... which a plain substring search
# would have wrongly counted), 96% of it in "wc.Vale+Tribute".
[[patterns]]
id = "ess_timer"
pattern = '\bESS\b'
case_insensitive = true
action = { type = "notify" }

# Data-derived: a shared https://dscan.info/... link, i.e. someone posting a
# directional scan result for the fleet to read. 816 hits in the organic
# corpus, 98% of it in "wc.Vale+Tribute", effectively zero false-positive
# risk since it is a URL shape, not a keyword.
[[patterns]]
id = "dscan_link"
pattern = 'dscan\.info/v/[0-9a-fA-F]+'
action = { type = "notify" }

# Data-derived: a structured "Kill: <victim> (<ship>)" report (966 hits in
# "wc.Vale+Tribute" out of 1431 total in the raw corpus). Deliberately kept
# case-sensitive ("Kill:", not "kill:") -- the one lowercase "kill:" found
# in the whole corpus was an unrelated YouTube link ("Music for the
# kill: ..."), so requiring the capital K removes that false positive for
# free without losing any real report (every genuine one used "Kill:").
[[patterns]]
id = "kill_report"
pattern = '\bKill:\s'
action = { type = "notify" }

# Data-derived: someone asking whether a system/gate is still clear, e.g.
# "fc gate status?", "H-5GUI status?" (215 hits, 92% in "wc.Vale+Tribute";
# also matches the full-width "？" used by some CJK IME chat clients in this
# corpus).
[[patterns]]
id = "status_query"
pattern = '\bstatus\s*[?？]'
case_insensitive = true
action = { type = "notify" }
category = "query"

# Ship-name detection, built from the official CCP SDE
# (invCategories/invGroups/invTypes, categoryID 6 "Ship", 423 published
# names). Like ship_report_es/fr/ja/ko below, this enumerates the full
# official catalog rather than filtering by corpus frequency: an earlier
# version of this rule only included the 187 names that showed up inside a
# structured "Kill: <victim> (<ship>)" report in this alliance's corpus,
# but that has the same representativeness problem documented for the
# other languages -- not encountering a ship in one alliance's kill
# reports does not mean that ship is rare across EVE's whole playerbase.
# 48 variant forms ("Osprey Navy Issue", "Caracal Navy Issue", ...) were
# dropped as redundant: their base hull name ("Osprey", "Caracal") is
# already in the list and, being a whole-word match, already matches
# inside the variant string, so listing both adds nothing. That leaves
# 375 words.
#
# Known, accepted false-positive risk: several official ship names are
# also common English words or coincide with plausible pilot handles --
# "Ares" collided with a pilot literally named "Ares Skarr" in this
# corpus, "Echo"/"Sin" are common pilot first names ("Echo 7", "Cold
# Sin"), "Burst" is also a module name ("Command Burst Specialist"), and
# generic nouns like "Ark", "Widow", "Crane", "Cobra", "Eagle", "Python",
# "Vulture", "Hyena", "Bane", "Imp", "Hel" can appear in ordinary chat
# unrelated to the ship. This is a deliberate completeness-over-precision
# choice, same as the other language dictionaries -- accepted because
# this is `notify`, not `map_alert`, so a stray hit only adds a log line,
# it never mis-highlights a system on the map. If your community finds
# specific words too noisy, disable this dictionary and split it into
# your own with the offending words removed (words = [...] can be edited
# freely; there's no need to keep this exact list), or set
# case_insensitive = false below to at least stop lowercase common-word
# chatter from matching.
#
# case_insensitive = true because roughly half of genuine mentions in
# this corpus are lowercase ("sabre", "vedmak", ...); combined with the
# full catalog above, this is the main source of the false-positive risk
# just described -- a lowercase common word now matches too, not just a
# capitalized one. Known collisions with pilot two-word handles ("Ledger
# Wolf", "Rende Crow", "Darkness Hawk", "Fuxi Legion") and one region name
# ("Curse", the 0.0 region, vs. the Curse-class ship) were already
# accepted under the smaller list and still apply.
[[patterns]]
id = "ship_report_zh"
pattern = '[一-鿿]{2,14}级'
action = { type = "notify" }
category = "ship"

# Other languages were checked against this same corpus and against the
# SDE's other localized ("de"/"es"/"fr"/"ja"/"ko"/"ru") ship-name columns:
#   - German and Russian ship names in the SDE are (with one irrelevant
#     exception) IDENTICAL to the English name -- Russian-speaking pilots
#     in this corpus do write "Chimera*", "Dread Guristas Capital Shield
#     Extender*" etc. verbatim inside Cyrillic sentences, so ship_report_en
#     already catches them with no changes. No dedicated rule needed for
#     either language.
#   - Spanish, French, Japanese and Korean DO have real, systematic ship
#     name translations (90/423, 61/423, 422/423 and 423/423 official
#     names differ from English respectively), even though this specific
#     corpus barely shows them (Spanish: 44 hits, 0.04%; French: 0 hits;
#     Japanese/Korean: ~0.01%, statistical noise). A single alliance's
#     chat logs are not a representative sample of EVE's whole playerbase,
#     so -- unlike every other rule in this file -- ship_report_es/fr/
#     ja/ko below were NOT filtered by corpus frequency: they enumerate
#     every official SDE name that differs from English in that language,
#     full stop. Treat them as lower-confidence than the corpus-validated
#     rules above: there is no local evidence to confirm real usage or
#     false-positive rate, only that CCP's own translators used that name.
#   - Japanese and Korean names are phonetic transliterations (katakana/
#     hangul) with no structural marker equivalent to Chinese's 级 class
#     suffix (checked: no common suffix character accounts for more than
#     ~15% of names in either language), so -- unlike ship_report_zh --
#     they need explicit word lists, not a shape rule. Also unlike
#     English/Chinese, most of the Japanese/Korean scripts have no spaces
#     between words in normal prose, so a `\b`-equivalent word boundary
#     around a short transliterated name is more likely to also match
#     inside an unrelated longer word; this is a known, unquantified risk
#     for ship_report_ja/ko specifically (not for ship_report_es/fr, which
#     are space-delimited like English).
#   - Each language is kept as its own `[[dictionaries]]` entry rather than
#     merged into one, so a community that only cares about e.g. Japanese
#     can disable the others (`enabled = false`) without losing anything,
#     and so each one's provenance/trade-offs (documented above and per
#     rule below) stay attached to it individually. `[[dictionaries]]` has
#     no per-entry length budget (unlike `[[patterns]]`'s 1024-byte
#     MAX_PATTERN_LEN), so unlike the old regex-based version of these
#     rules, each language now fits in a single entry instead of being
#     split across 2-8 numbered parts to stay under that budget.
# If your own community's language mix differs, re-run this same
# methodology (cross-reference the SDE's localized name column for your
# language against your corpus, or -- as here -- against the full SDE
# if your own logs are too small a sample) before deciding whether a
# rule is worth adding, and to decide the risk trade-off for yourself.

# Spanish ship names (82; 90 official SDE names differ from English, but
# "Brutix", "Drake", "Golem", "Harbinger", "Velator", "Scorpion",
# "Abaddon" and "Nyx" were dropped as redundant -- their Spanish name is
# identical to the English one, which is now in ship_report_en's full
# catalog above, so keeping them here would just double-report the same
# sighting under two rule ids for no gain).
