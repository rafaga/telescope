[package]
name = "webb"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["crypted-db"]
esi-api-test = []
crypted-db = ["rusqlite/bundled-sqlcipher"]
puffin = ["dep:puffin"]
native-auth-flow = []

[dependencies]
chrono = "0.4.45"
hyper = { version = "1.10.1", features = ["server", "client", "http1"] }
hyper-tls = "0.6.0"
open = "5.3.5"
rfesi = { version = "0.50.0", default-features = false, features = ["rustls-tls", "random_state", "validate_jwt"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
tokio = { version = "1.52.3", features = ["tokio-macros", "rt", "rt-multi-thread", "macros"] }
puffin = { version = "0.20.0", optional = true, default-features = false}
bytes = "1.11.1"
http-body-util = "0.1.3"
hyper-util = { version = "0.1.20", features = ["full"] }
rusqlite = { version = "0.40.1", features = ["backup", "blob", "array"] }

# Windows:
[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl", "backup", "blob", "array"]}
windows = { version = "0.62.2", features = ["System_Profile","Storage_Streams"], optional = true  }

# MacOS:
[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-kit = { version = "0.3.2", features = ["libc"], default-features = false}
objc2-core-foundation = { version = "0.3.2", features = ["CFString"] }

# WASM specific dependencies:
[target.'cfg(wasm)'.dependencies]
