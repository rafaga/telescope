[package]
name = "telescope-derive"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Derive macros that turn the fields of a type into the properties of an egui-ide property grid."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
egui-ide = { path = "../egui-ide", default-features = false }

[lints]
workspace = true
