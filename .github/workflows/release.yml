name: Release installers

# Builds the Windows MSI (WiX) and macOS dmg with `cargo packager` and
# attaches them to the GitHub release that triggered the run. `formats` in
# `packager.json` is ["wix", "dmg"]; cargo-packager only builds the format(s)
# valid for the host OS it's running on and skips the rest (it logs "ignoring
# wix" on macOS, "ignoring dmg" on Windows) -- so one job per OS, no extra
# format selection needed.
#
# Run by hand ("Run workflow", with a `tag` such as v0.0.0-test) it builds the
# same installers but keeps them as workflow artifacts instead of attaching them
# to a release, to try the packaging without publishing anything.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag the installer version is derived from (nothing is published)"
        required: true
        default: v0.0.0-test

# One release at a time per tag; a second run for the same tag waits.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  # Pinned so the cache below has a stable key; bump it on purpose.
  PACKAGER_VERSION: 0.11.8

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The lockfile is versioned: a release must build exactly what was
      # tested, so a Cargo.lock that no longer matches the manifests stops here
      # instead of being re-resolved. (`beforePackagingCommand` in
      # packager.json runs the actual build and cannot take `--locked`.)
      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
        shell: bash

      # Without the ESI credentials the build still succeeds (`option_env!`
      # yields None) and the installer panics for every user at start-up, so
      # stop before spending the build.
      - name: Check the ESI secrets
        shell: bash
        env:
          ESI_CLIENT_ID: ${{ secrets.ESI_CLIENT_ID }}
          ESI_SECRET_KEY: ${{ secrets.ESI_SECRET_KEY }}
        run: |
          missing=0
          for name in ESI_CLIENT_ID ESI_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is empty or missing; the installer would panic at start-up."
              missing=1
            fi
          done
          exit "$missing"

      # packager.json's "version" is a hand-maintained literal (currently
      # "0.0.1", already out of sync with the workspace Cargo.toml's 0.1.0)
      # -- cargo-packager stamps the MSI/dmg with it, it isn't picked up
      # from Cargo.toml. Overwrite it from the release tag so every release
      # ships installers versioned to match it, instead of relying on
      # someone remembering to bump packager.json by hand before tagging.
      #
      # WiX/MSI's ProductVersion must be plain "major.minor.build" numbers
      # (each 0-65535) -- no "-rc01"/"+something" suffix survives as-is, or
      # cargo-packager fails the Windows job with "Optional build metadata
      # in app version must be numeric-only and cannot be greater than
      # 65535 for msi target" (hit for real on tag 1.0.0-rc01).
      #
      # Fix: strip the tag down to its numeric major.minor.patch core, then
      # attach the CI run number as semver build metadata ("+<run_number>").
      # cargo-packager (inherited from tauri-bundler, confirmed by reading
      # its version-conversion PR) special-cases a purely-numeric "+build"
      # by using it as a literal 4th MSI version field, so "1.0.0+187"
      # becomes ProductVersion 1.0.0.187. github.run_number increases by 1
      # on every run of this workflow, so every build -- RC or final, no
      # matter how the tag is spelled -- gets a strictly increasing,
      # always-valid installer version, and the tag itself is free to stay
      # human-readable ("v1.0.0-rc01", "v1.0.0-rc02", "v1.0.0", ...). The
      # installer's ProductVersion (1.0.0.187) won't visually match the tag
      # -- if that distinction needs to be visible somewhere, it belongs in
      # the app's own About/title, not in this metadata field.
      #
      # (github.run_number is scoped to this workflow file and resets if
      # the workflow is ever renamed/recreated; also capped at 65535 by the
      # same MSI limit -- a non-issue at this project's release cadence.)
      - name: Sync packager.json version with the release tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="${TAG#v}"
          version="${version%%-*}"
          version="${version%%+*}"
          version="${version}+${RUN_NUMBER}"
          jq --arg v "$version" '.version = $v' packager.json > packager.json.tmp
          mv packager.json.tmp packager.json

      # Building cargo-packager from source takes minutes on every release.
      - name: Cache cargo-packager
        id: packager
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: cargo-packager-${{ env.PACKAGER_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-packager
        if: steps.packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version ${{ env.PACKAGER_VERSION }}

      # packager.json's beforePackagingCommand already runs
      # `cargo build --release -p telescope`, so this alone builds the
      # binary and packages it. `--release` here (packager's own flag, not
      # cargo's) makes cargo-packager point at target/release to match --
      # see the doc comment on this workflow.
      #
      # ESI_CLIENT_ID/ESI_SECRET_KEY are baked into the binary at compile
      # time (see crates/telescope/src/app/data.rs and BUILD.md) -- without
      # them the build still succeeds (option_env! just yields None), but
      # the resulting installer panics for every user the moment
      # TelescopeApp::new() calls AppData::new(). Sourced from repo secrets
      # (Settings -> Secrets and variables -> Actions), never committed.
      #
      # APPLE_SIGNING_IDENTITY: "-" is ad-hoc signing (macOS only -- ignored
      # on Windows). No Apple Developer account/certificate involved, it's
      # the pseudo-identity `codesign --sign -` uses to self-sign locally.
      # Required just to let the app *launch* on Apple Silicon (macOS
      # refuses to run an unsigned arm64 binary at all) -- it does NOT
      # notarize or satisfy Gatekeeper for a downloaded file: users still
      # get the "unidentified developer" prompt and have to right-click ->
      # Open the first time. Real notarization needs a paid Developer ID
      # certificate (see claude/release-ci-installers.md) -- this is the
      # no-cost stand-in until/unless that's set up. `packager.json` itself
      # is left untouched (macos.signingIdentity stays unset) so this only
      # applies to this CI build, not Rafael's manual local packaging.
      - name: Build installer
        env:
          ESI_CLIENT_ID: ${{ secrets.ESI_CLIENT_ID }}
          ESI_SECRET_KEY: ${{ secrets.ESI_SECRET_KEY }}
          APPLE_SIGNING_IDENTITY: "-"
        run: cargo packager --release

      # Fails when nothing was produced (the upload alone would not), and
      # records a SHA-256 of each installer next to it.
      - name: Checksums
        shell: bash
        working-directory: target/release
        run: |
          files=$(ls *.msi *.dmg 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::cargo packager produced no .msi or .dmg in target/release"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          $sum $files > "SHA256SUMS-${{ runner.os }}.txt"
          cat "SHA256SUMS-${{ runner.os }}.txt"

      - name: Upload installer to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            target/release/*.msi
            target/release/*.dmg
            target/release/SHA256SUMS-*.txt

      - name: Keep the installer as an artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            target/release/*.msi
            target/release/*.dmg
            target/release/SHA256SUMS-*.txt
          if-no-files-found: error
