[package]
name = "telescope"
authors = ["Rafael Amador <rafaga@duck.com>"]
description = "Application to gather intel and alert players in Eve Online"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enables live profiling with the Tracy profiler (https://github.com/wolfpld/tracy):
# `cargo run --features profile-with-tracy`, then open the Tracy desktop app and
# connect (it auto-discovers the running process on the local network).
#
# MIGRATION IN PROGRESS (profiling -> tracing + tracing-tracy, see the
# project's numbered `t0N`/`w0N`/`n0N` patches): this still also enables
# `profiling`'s own tracy backend, for any `profiling::function_scope!()`
# call site not yet migrated to `#[tracing::instrument]` (here, or in
# `webb`/`native_tools`/`sde`/`egui-map`). Both mechanisms share the same
# underlying `tracy_client::Client` (`Client::start()` is idempotent), so
# nothing stops reporting to Tracy mid-migration. The `profiling`-related
# entries here will be dropped once every call site is migrated.
profile-with-tracy = [
    "profiling/profile-with-tracy",
    "dep:tracy-client",
    "dep:tracing-tracy",
]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
sde = { version = "0.2.1" }
kdtree = { version = "0.8.0" }
# egui-map = { path = "../../../egui-map/" }
egui-map = { version = "0.3.1" }
open = "5.3.2"
webb = { path = "../webb/", default-features = false, features = []}
chrono = "0.4.42"
tokio = { version = "1.47.1", features = ["tokio-macros", "rt", "rt-multi-thread", "macros"] }
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
image = { version = "0.25.8", features = ["jpeg","png"] }
egui_tiles = { version = "0.17.0" }
toml = "1.1.2"
hyper = { version = "1.7.0", features = ["server", "http1", "client"] }
rfesi = {version = "0.50.0", default-features = false, features = ["rustls-tls", "random_state", "validate_jwt"] }
serde = { version = "1.0.228", features = ["derive"] }
hyper-util = { version = "0.1.17", features = ["full"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_kqueue"] }
directories = "6.0.0"
regex = "1.12.1"
native_tools = { path = "../native_tools/"}
profiling = "1.0"
tracing = "0.1"
tracy-client = { version = "0.18", optional = true }


# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3.20"
tracing-tracy = { version = "0.11", optional = true }
env_logger = { version = "0.11.8", features = ["auto-color", "humantime"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.54"

[target.'cfg(not(target_os  = "windows"))'.dependencies]
wgpu = { version="30.0.0" }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version="30.0.0", features = ["dx12"], default-features = false }
windows = { version = "0.62.2", features = ["Win32_UI_Shell","Win32_UI_Shell_Common","Win32_System_Com","Win32_Foundation",] }
