[workspace]
resolver = "2"
members = [
    "crates/telescope",
    "crates/webb",
    "crates/native_tools",
    "crates/egui-panels",
    "crates/zkill",
    "crates/eve-scout",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"
version = "1.0.6"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"
broken_intra_doc_links = "warn"

[profile.release]
opt-level = 2 # fast and small wasm
panic = "abort"

[profile.dev]
opt-level = 0 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 0

[patch.crates-io]
# If you want to use the bleeding edge version of egui and eframe:
# egui = { git = "https://github.com/emilk/egui", branch = "master" }
# eframe = { git = "https://github.com/emilk/egui", branch = "master" }
#egui-map = { git = "https://github.com/rafaga/egui-map", branch = "dev" }
# `egui_map::map::layer` (layers, `NodeContext::layers`) is not on crates.io
# yet: use the sibling checkout until egui-map publishes it, then drop this
# line.
# egui-map = { path = "../egui-map" }
# `get_system_kills_snapshot` (0.2.2) is not on crates.io yet: same as above.
# esi-openapi = { path = "../esi-openapi" }
# `sde::projection_patch` (feature `projection-patch`, unreleased) is not on
# crates.io yet: the sibling checkout until it is published, then drop this
# line.
sde = { path = "../sde" }
# sde = { git = "https://github.com/rafaga/sde", branch = "test" }