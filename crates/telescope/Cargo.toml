[package]
name = "telescope"
authors = ["Rafael Amador <rafaga@duck.com>"]
description = "Application to gather intel and alert players in Eve Online"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
puffin = ["dep:puffin", "dep:puffin_http", "eframe/__screenshot", "egui-map/puffin", "sde/puffin", "webb/puffin"]

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
sde = { path = "../sde/"}
kdtree = { version = "0.8.0" }
# egui-map = { path = "../../../egui-map/" }
egui-map = { version = "0.0.17"}
open = "5.3.2"
webb = { path = "../webb/", default-features = false, features = []}
chrono = "0.4.42"
tokio = { version = "1.47.1", features = ["tokio-macros", "rt", "rt-multi-thread", "macros"] }
egui_extras = { version = "0.34.3", features = ["all_loaders"] }
image = { version = "0.25.8", features = ["jpeg","png"] }
puffin = {version = "0.20.0", optional = true, default-features = false}
puffin_http = {version = "0.17.0", optional = true, default-features = false}
egui_tiles = { version = "0.15.0" }
toml = "1.1.2"
hyper = { version = "1.7.0", features = ["server", "http1", "client"] }
rfesi = {version = "0.50.0", default-features = false, features = ["rustls-tls", "random_state", "validate_jwt"] }
serde = { version = "1.0.228", features = ["derive"] }
hyper-util = { version = "0.1.17", features = ["full"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_kqueue"] }
directories = "6.0.0"
regex = "1.12.1"
native_tools = { path = "../native_tools/"}

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3.20"
env_logger = { version = "0.11.8", features = ["auto-color", "humantime"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.54"

[target.'cfg(not(target_os  = "windows"))'.dependencies]
wgpu = { version="29.0.3" }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version="29.0.3", features = ["dx12"], default-features = false }
windows = { version = "0.62.2", features = ["Win32_UI_Shell","Win32_UI_Shell_Common","Win32_System_Com","Win32_Foundation",] }
