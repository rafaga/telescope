on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

name: Linux

env:
  # This is required to enable the web_sys clipboard API which egui_web uses
  # https://rustwasm.github.io/wasm-bindgen/api/web_sys/struct.Clipboard.html
  # https://rustwasm.github.io/docs/wasm-bindgen/web-sys/unstable-apis.html
  RUSTFLAGS: --cfg=web_sys_unstable_apis

jobs:
  build:
    name: check, test and clippy on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # ALSA for the alarm sound (rodio/cpal), OpenSSL for SQLCipher and TLS.
      # The window system libraries are loaded at run time, not linked.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config
      - run: cargo check --all-features
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
