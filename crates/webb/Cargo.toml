[package]
name = "webb"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["crypted-db"]
# SQLCipher encryption of the player database, keyed from the machine
# identifier `native_tools` reads (see `esi/cipher.rs`).
crypted-db = ["rusqlite/bundled-sqlcipher"]

[dependencies]
aho-corasick = { workspace = true }
jiff = { workspace = true, features = ["std"] }
regex = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["serde_derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyper = { workspace = true, features = ["server", "client", "http1"] }
hyper-tls = { workspace = true }
esi-openapi = { workspace = true, features = ["random_state", "validate_jwt"] }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["tokio-macros", "rt", "rt-multi-thread", "macros", "time"] }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true, features = ["full"] }
rusqlite = { workspace = true, features = ["backup", "blob", "array"] }
native_tools = { workspace = true }
sha2 = { workspace = true }

# `std::time::Instant` panics on `wasm32-unknown-unknown`; `web-time` is the same type and uses the browser clock there. Every other target keeps `std::time::Instant`.
# WASM specific dependencies:
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

# Windows:
[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl", "backup", "blob", "array"], optional = true }

[dev-dependencies]
mockall = { workspace = true }
# `graph` tests serialize a rule graph; the `esi` feature also pulls this in.
serde_json = { workspace = true }

[lints]
workspace = true
