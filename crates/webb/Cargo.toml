[package]
name = "webb"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["crypted-db"]
esi-api-test = []
# SQLCipher encryption of the player database, keyed from the machine
# identifier `native_tools` reads (see `esi/cipher.rs`).
crypted-db = ["rusqlite/bundled-sqlcipher", "dep:native_tools", "dep:sha2"]
native-auth-flow = []

[dependencies]
aho-corasick = "1.1"
chrono = "0.4.45"
regex = "1.12.1"
toml = "1.1.2"
hyper = { version = "1.10.1", features = ["server", "client", "http1"] }
hyper-tls = "0.6.0"
open = "5.3.5"
rfesi = { version = "0.50.0", default-features = false, features = ["rustls-tls", "random_state", "validate_jwt"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0"
base64 = "0.23.1"
tokio = { version = "1.52.3", features = ["tokio-macros", "rt", "rt-multi-thread", "macros", "time"] }
bytes = "1.11.1"
http-body-util = "0.1.3"
hyper-util = { version = "0.1.20", features = ["full"] }
rusqlite = { version = "0.40.1", features = ["backup", "blob", "array"] }
native_tools = { path = "../native_tools/", optional = true }
sha2 = { version = "0.10", optional = true }
tracing = "0.1"

# Windows:
[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl", "backup", "blob", "array"]}

[dev-dependencies]
mockall = "0.15.0"

# WASM specific dependencies:
[target.'cfg(wasm)'.dependencies]
