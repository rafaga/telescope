# Telescope interface texts, Spanish. Template with every key of `en.toml`
# and empty values, to be filled in. Keep `%{name}` placeholders as they are in
# `en.toml`. Settings -> General offers the language once `language.name`
# has a value; an empty value is shown as blank text (not as English), so fill
# in the rest before that. See `src/i18n.rs`.

[language]
# This language's own name, as the selector in Settings -> General shows it.
name = "Español"

[menu]
file = "Archivo"
preferences = "Preferencias"
debug = "Depuración"
quit = "Salir"
help = "Ayuda"
about = "Acerca de Telescope"

