[package]
name = "telescope"
authors = ["Rafael Amador <rafaga@duck.com>"]
description = "Application to gather intel and alert players in Eve Online"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enables live profiling with the Tracy profiler (https://github.com/wolfpld/tracy):
# `cargo run --features profile-with-tracy`, then open the Tracy desktop app and
# connect (it auto-discovers the running process on the local network). A
# consumer of `sde`/`egui-map`/`webb`/`native_tools` that also enables
# `profile-with-tracy` gets their spans in the same trace for free, via
# Cargo's feature unification on the shared `tracing` dependency.
profile-with-tracy = ["dep:tracing-tracy","egui-map/debug_overlay"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
# `builder` pulls in reqwest/tokio/zip/etc. (see sde's own Cargo.toml) so
# `database_updater` can drive the same check-for-a-new-build/download/
# parse steps `sde`'s own `sde-builder` CLI does -- see
# `crates/telescope/src/app/database_updater.rs`.
sde = { version = "0.2.2", features = ["builder"] }
# Only needed here to name the `rusqlite::Connection` handed to
# `sde::builder::schema::create_schema`/`Parser::build_database` --
# `database_updater.rs` owns opening/creating the `sde.db` file itself
# (there's no higher-level entry point in `sde` today that would do this
# on its own; see that module's docs). Cargo unifies this with the same
# `rusqlite` version `sde`/`webb` already pull in, so this doesn't
# duplicate the SQLite build.
rusqlite = { version = "0.40" }
kdtree = { version = "0.8.0" }
# egui-map = { path = "../../../egui-map/" }
egui-map = { version = "0.3.1" }
open = "5.3.2"
webb = { path = "../webb/", default-features = false, features = []}
chrono = "0.4.42"
tokio = { version = "1.47.1", features = ["tokio-macros", "rt", "rt-multi-thread", "macros"] }
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
image = { version = "0.25.8", features = ["jpeg","png"] }
egui_tiles = { version = "0.17.0" }
toml = "1.1.2"
hyper = { version = "1.7.0", features = ["server", "http1", "client"] }
rfesi = {version = "0.50.0", default-features = false, features = ["rustls-tls", "random_state", "validate_jwt"] }
serde = { version = "1.0.228", features = ["derive"] }
hyper-util = { version = "0.1.17", features = ["full"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_kqueue"] }
directories = "6.0.0"
regex = "1.12.1"
# Multi-literal ("dictionary") matching for pattern rules whose alternatives
# are plain words rather than a hand-written regex (e.g. ship names in
# several languages) -- already pulled transitively by `regex`, declared
# directly here so patterns.rs can build its own automaton per dictionary
# instead of being bound by the single combined RegexSet's pattern-length
# budget. See the "Dictionary rules" section of patterns.rs's module docs.
aho-corasick = "1.1"
native_tools = { path = "../native_tools/"}
tracing = "0.1"
# Bridges `log`-based diagnostics from dependencies (hyper, notify, wgpu,
# rfesi, ...) into `tracing`, so nothing that used to go through `log` is
# lost now that neither `env_logger` (native) nor `eframe::WebLogger` (web)
# own the `log` sink anymore.
tracing-log = "0.2"


# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-tracy = { version = "0.11", optional = true }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.54"
tracing-wasm = "0.2"

[target.'cfg(not(target_os  = "windows"))'.dependencies]
wgpu = { version="30.0.0" }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version="30.0.0", features = ["dx12"], default-features = false }
windows = { version = "0.62.2", features = ["Win32_UI_Shell","Win32_UI_Shell_Common","Win32_System_Com","Win32_Foundation",] }
