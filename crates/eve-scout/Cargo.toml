[package]
name = "eve-scout"
authors = ["Rafael Amador <rafaga@duck.com>"]
description = "Client of the public EvE-Scout API (Thera and Turnur wormholes, storms, routes)"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
jiff = { workspace = true, features = ["std", "serde"] }
reqwest = { workspace = true, features = ["json", "gzip", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `sync` for the turn of a request (the Mutex of `guard`).
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# Only for `tests/live.rs`, which compares the wormhole classes of the API
# with the ones of a real `sde.db`.
rusqlite = { workspace = true, features = ["bundled"] }
