# Telescope interface texts, Spanish. Template with every key of `en.toml`
# and empty values, to be filled in. Keep `%{name}` placeholders as they are in
# `en.toml`. Settings -> General offers the language once `language.name`
# has a value; an empty value is shown as blank text (not as English), so fill
# in the rest before that. See `src/i18n.rs`.

[language]
# This language's own name, as the selector in Settings -> General shows it.
name = "Español"

[menu]
file = "Archivo"
preferences = "Preferencias"
debug = "Depuración"
quit = "Salir"
help = "Ayuda"
about = "Acerca de Telescope"

[about]
title = "Acerca de Telescope"
author = "Autor: %{name}"
license = "Licencia: %{license}"

[settings]
title = "Configuración"
save = "Guardar"
unsaved = "⚠ Existen cambios sin guardar"

[settings.pages]
general = "General"
intelligence = "Inteligencia"
characters = "Personajes"

[settings.general]
heading = "Interfaz"
language = "Idioma:"
auto = "Automático (%{language})"
language_hint = "\"Automático\" sigue el idioma de tu sistema operativo. El cambio se aplica de inmediato y se guarda."
startup_maps = "Mapas al iniciar"
startup_help = "Por omisión se muestran el mapa del universo y los mapas de las regiones donde tienes personajes vinculados. Marca aquí otras regiones para que su mapa también se abra al iniciar."

[settings.intelligence]
alerts = "Alertas"
warn_before = "Avisarme cuando un enemigo esté a"
warn_after = "sistemas o menos de mí"
alert_sound = "Sonido de alerta:"
play_sound = "Reproducir este sonido"
center_on_alert = "Centrar los mapas en el personaje alertado"
center_on_alert_hint = "Cuando suena una alerta, mueve todos los mapas al personaje vinculado más cercano al sistema reportado."
chat_logs = "Registros de canales de EVE:"
select = "Seleccionar"
default = "Predeterminado"
monitored = "Canales monitoreados"
monitored_help = "Selecciona los canales de intel que quieres monitorear."
no_channels = "No se detectaron canales de intel"

[settings.data_sources]
heading = "Rutas de Datos"
sde = "Base de datos SDE:"
player_db = "Base de datos privada:"
player_db_hint = "Aquí se guardan los personajes vinculados. El archivo se crea si no existe; los cambios se aplican al reiniciar Telescope."
check_updates = "🔄 Buscar actualizaciones del SDE"

[settings.characters]
heading = "Personajes vinculados"
help = "Se usan para emitir notificaciones cuando algo está cerca de tu ubicación."
add = "➕ Agregar"
add_hint = "Inicia sesión con EVE SSO en tu navegador para vincular un personaje"
remove = "✖ Desvincular"
remove_hint = "Desvincular a %{name}"
remove_disabled = "Selecciona un personaje para desvincularlo"
alliance = "Alianza:"
no_alliance = "Sin alianza"
corporation = "Corporación:"
no_corporation = "Sin corporación"
last_logon = "Último inicio de sesión:"
empty = "⚠ No hay personajes vinculados. Usa ➕ Agregar para vincular uno."

[map]
universe = "Universo"
search_region = "Buscar región"
set_beacon = "Establecer marcador"
settings = "⚙ Configuración"

[log]
title = "Bitácora (%{count})"
collapse = "Colapsar la bitácora"
expand = "Expandir la bitácora"

[sde_update]
title = "Actualizando SDE"
checking = "Verificando actualizaciones..."
downloading = "Descargando actualizaciones..."
rebuilding = "Reconstruyendo base de datos, puede demorar unos minutos..."

