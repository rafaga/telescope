[workspace]
resolver = "2"
members = [
    "crates/telescope",
    "crates/webb",
    "crates/native_tools",
    "crates/egui-panels",
    "crates/egui-ide",
    "crates/egui-weave",
    "crates/telescope-derive",
    "crates/zkill",
    "crates/eve-scout",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"
version = "1.1.2"

[workspace.dependencies]
# Versions and shared options of the dependencies of every crate of the workspace:
# the crates say `name = { workspace = true }` and add only their own features.
# A member can add features but cannot turn default features back on, so an entry
# with `default-features = false` is the lean base and each crate adds what it needs.

# The crates of this workspace

egui-ide = { path = "crates/egui-ide" }
native_tools = { path = "crates/native_tools" }

# External
aho-corasick = "1.1"
base64 = "0.23"
bytes = "1.12"
eframe = { version = "0.37", default-features = false }
egui = { version = "0.37", default-features = false }
egui_kittest = "0.37"
esi-openapi = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = "1.12"
hyper-tls = "0.6"
hyper-util = "0.1"
jiff = { version = "1", default-features = false, features = ["std"] }
mockall = "0.15"
proc-macro2 = "1"
quote = "1"
regex = "1.13"
reqwest = "0.13"
rusqlite = "0.42"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
syn = "2"
tokio = "1.54"
toml = "1.1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"
broken_intra_doc_links = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 0

# TEMPORARY: the local checkout (branch `telescope`) has `screen_to_graph`,
# which is not pushed yet. Remove this section once it is, and run
# `cargo update -p egui-snarl`.
[patch."https://github.com/rafaga/egui-snarl"]
egui-snarl = { path = "../egui-snarl" }

[patch.crates-io]
# If you want to use the bleeding edge version of egui and eframe:
# egui = { git = "https://github.com/emilk/egui", branch = "master" }
# eframe = { git = "https://github.com/emilk/egui", branch = "master" }
#egui-map = { git = "https://github.com/rafaga/egui-map", branch = "dev" }
# `egui_map::map::layer` (layers, `NodeContext::layers`) is not on crates.io
# yet: use the sibling checkout until egui-map publishes it, then drop this
# line.
# The runtime nodes and lines, the label and dashes of a segment and the view
# limits of `egui-map` (unreleased) are used by the wormholes on the maps.
# egui-map = { path = "../egui-map" }
# `get_system_kills_snapshot` (0.2.2) is not on crates.io yet: same as above.
# esi-openapi = { path = "../esi-openapi" }
# `sde::projection_patch` (feature `projection-patch`, unreleased) is not on
# crates.io yet: the sibling checkout until it is published, then drop this
# line. The checkout also uses `jiff` for the times of the wormhole links
# (`Wormhole::expires_at` is a `jiff::Timestamp`), which the 0.8.0 on
# crates.io does not: the migration from `chrono` to `jiff` needs it.
sde = { path = "../sde" }
# sde = { git = "https://github.com/rafaga/sde", branch = "test" }