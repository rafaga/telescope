[package]
name = "zkill"
authors = ["Rafael Amador <rafaga@duck.com>"]
description = "Requests to zKillboard (the R2Z2 feed and the query API) kept under its rate limits"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
jiff = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["json", "gzip"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util", "time", "sync"] }
