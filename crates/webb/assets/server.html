<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Telescope login</title>
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg-base: #05060c;
    --card: rgba(12, 17, 30, 0.62);
    --border: rgba(150, 180, 235, 0.22);
    --text: #f1f4fb;
    --muted: #a3b0cd;
    --ok: #3ee6a8;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    /* fallback colour if the embedded image ever fails to decode */
    background: var(--bg-base);
    overflow: hidden;
  }

  /* ---- photographic backdrop, embedded as a data URI (no external request) ---- */
  .bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  .bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* the sun sits left of centre at this framing, so the card lands on the
       quieter mid-field rather than on the brightest part of the image */
    object-position: 46% 50%;
    transform-origin: 52% 48%;
    will-change: transform;
    /* very slow Ken Burns drift -- cinematic, not distracting */
    animation: drift 90s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: scale(1.03) translate(0, 0); }
    to   { transform: scale(1.13) translate(-1.6%, -1.1%); }
  }

  /* readability scrim: darkens the frame edges and the area behind the card
     without flattening the image */
  .scrim {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(52% 54% at 50% 50%, rgba(3, 5, 12, 0.62) 0%, rgba(3, 5, 12, 0.28) 58%, transparent 80%),
      linear-gradient(to bottom, rgba(3, 5, 12, 0.30) 0%, rgba(3, 5, 12, 0.18) 45%, rgba(3, 5, 12, 0.52) 100%),
      radial-gradient(135% 115% at 50% 50%, transparent 42%, rgba(2, 3, 8, 0.82) 100%);
  }

  .card {
    position: relative;
    z-index: 2;
    width: min(420px, 88vw);
    padding: 40px 36px 34px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    backdrop-filter: blur(18px) saturate(1.15);
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    box-shadow:
      0 28px 80px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-bottom: 22px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--muted);
  }

  .brand img {
    height: 24px;
    width: auto;
    filter: drop-shadow(0 0 7px rgba(87, 214, 208, 0.4));
  }

  .check {
    width: 72px;
    height: 72px;
    margin: 4px auto 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(62, 230, 137, 0.22), rgba(62, 230, 137, 0.05) 70%);
    box-shadow: 0 0 0 1px rgba(62, 230, 137, 0.35), 0 0 40px rgba(62, 230, 137, 0.25);
  }

  .check svg {
    width: 34px;
    height: 34px;
    stroke: var(--ok);
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 48;
    stroke-dashoffset: 48;
    animation: draw 0.5s 0.4s ease-out forwards;
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  h1 {
    margin: 0 0 10px;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
  }

  p {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
  }

  .hint {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 12.5px;
    color: rgba(163, 176, 205, 0.75);
  }

  /* a 2.5:1 panorama cropped to a portrait window shows only a narrow slice --
     re-aim it at the ringed planet instead of the empty mid-field */
  @media (max-aspect-ratio: 1 / 1) {
    .bg img { object-position: 63% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg img, .card, .check svg { animation: none !important; }
    .bg img { transform: scale(1.03); }
    .check svg { stroke-dashoffset: 0; }
  }
</style>
</head>
